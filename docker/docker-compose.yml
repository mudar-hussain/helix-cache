services:

  node-a:
    build:
      context: ../service
    container_name: helix-node-a
    environment:
      HELIX_NODE_ID: node-a
      HELIX_HOST: node-a
      HELIX_PORT: 8081
    ports:
      - "8081:8081"
    networks:
      - helix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

