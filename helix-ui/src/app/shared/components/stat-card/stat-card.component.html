
<div class="text-center px-3">
    <div style="font-size: 1.4rem; font-weight: 900; color:#fff; text-shadow: var(--shadow-glow);">
        {{ value }}
    </div>
    <div style="font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase; color:var(--color-text-secondary)">
        {{ label }}
    </div>
    @if(sub) {
        <div style="font-size: 0.65rem; color:var(--color-text-muted); font-family: var(--font-mono);">
            {{ sub }}
        </div>
    }

</div>
