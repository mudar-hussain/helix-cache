<app-section-title icon="fa-solid fa-server" text="Cluster Nodes" />

@for (node of state.nodes(); track node.nodeId) {
<div class="node-card" [class.node-card--down]="node.nodeStatus === 'DOWN'">
    <div class="d-flex align-items-center justify-content-between gap-2">
        <div class="d-flex align-items-center gap-1">
            <span class="node-dot" [style.background]="node.nodeId | nodeColor"
                [style.box-shadow]="'0 0 8px ' + (node.nodeId | nodeColor) + '90'"></span>
            <span class="node-id ms-1" [style.color]="node.nodeId | nodeColor">{{ node.nodeId}}</span>
            <!-- <span class="ms-auto key-count">{{ node.keyCount }} keys</span>
            <app-status-badge [status]="node.nodeStatus" /> -->
        </div>
        <div class="d-flex align-items-center gap-1">
            @if (node.nodeStatus === 'DOWN') {
            <button class="btn-node btn-node--success w-100" (click)="resume(node)">
                <i class="fa-solid fa-play me-1"></i> Revive</button>
            } @else {
            <button class="btn-node btn-node--danger" (click)="pause(node)">
                <i class="fa-solid fa-pause me-1"></i> Fail</button>
            <button class="btn-node btn-node--warning" (click)="slow(node)">
                <i class="fa-solid fa-triangle-exclamation me-1"></i> Stress</button>
            }
        </div>
    </div>
</div>
}

@if (state.nodes().length === 0) {
<div class="text-center py-4" style="color:var(--color-text-muted); font-size:0.75rem;">
    <i class="fa-solid fa-spinner anim-spin d-block mb-2" style="font-size:1.2rem;"></i>Connecting...
</div>
}


<hr class="ops-divider" />

<!-- Mini SSE Live Stream -->
<app-activity-log />
