<app-section-title icon="O" text="Cluster Nodes" />

@for (node of state.nodes(); track node.nodeId) {
    <div class="node-card" [class.node-card--down]="node.nodeStatus === 'DOWN'">
        <div class="d-flex align-items-center gap-2 mb-2">
            <span class="node-dot" [style.background]="node.nodeId | nodeColor"
                [style.box-shadow]="'0 0 8px ' + (node.nodeId | nodeColor) + '90'"></span>
            <span class="node-id" [style.color]="node.nodeId | nodeColor">{{ node.nodeId}}</span>
            <span class="ms-auto key-count">{{ node.keyCount }} keys</span>
            <app-status-badge [status]="node.nodeStatus" />
        </div>

        <div class="d-flex justify-content-between node-meta mb-2">
            <span>HB miss: {{ node.missedHeartbeats }}</span>
            <span class="text-truncate" style="max-width:130px;">{{ node.address}}</span>
        </div>

        <div class="d-flex gap-1">
            @if (node.nodeStatus !== 'UP') {
                <button class="btn-node btn-node--success w-100" (click)="resume(node)"> Resume</button>
            } @else {
                <button class="btn-node btn-node--danger" (click)="pause(node)"> Pause</button>
                <button class="btn-node btn-node--warning" (click)="slow(node)"> Slow</button>
            }
        </div>
    </div>
}

@if (state.nodes().length === 0) {
    <div class="text-center py-4" style="color:var(--color-text-muted); font-size:0.75rem;">Connecting...</div>
}
